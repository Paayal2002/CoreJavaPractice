	<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Fresh Registration</title>

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: Arial, sans-serif;
}

body {
	background: linear-gradient(135deg, #4CAF50, #8BC34A);
	height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
}

.container {
	width: 400px;
	background: white;
	padding: 30px;
	border-radius: 15px;
	box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

h2 {
	text-align: center;
	color: #2E7D32;
	margin-bottom: 20px;
}

.input-group {
	margin-bottom: 15px;
}

.input-group label {
	display: block;
	margin-bottom: 5px;
	font-weight: bold;
	color: #333;
}

.input-group input {
	width: 100%;
	padding: 10px;
	border: 1px solid #ccc;
	border-radius: 8px;
	outline: none;
}

.input-group input:focus {
	border-color: #4CAF50;
}

.btn {
	width: 100%;
	padding: 12px;
	background: #4CAF50;
	color: white;
	border: none;
	border-radius: 8px;
	font-size: 16px;
	cursor: pointer;
}

.btn:hover {
	background: #388E3C;
}

.footer {
	text-align: center;
	margin-top: 15px;
}

.footer a {
	color: #4CAF50;
	text-decoration: none;
	font-weight: bold;
}
</style>
</head>

<body>

	<div class="container">
		<h2>🍎 Farm Fresh Registration</h2>

		<form action="NewFile" method="post">>
			<div class="input-group">
				<label>Full Name</label> <input type="text"
					placeholder="Enter your name" name="name" required>
			</div>

			<div class="input-group">
				<label>Email Address</label> <input type="email"
					placeholder="Enter your email" name="email" required>
			</div>

			<div class="input-group">
				<label>Mobile Number</label> <input type="tel"
					placeholder="Enter mobile number" name="mobNo" required>
			</div>

			<div class="input-group">
				<label>Address</label> <input type="text"
					placeholder="Enter your address" name=" address" required>
			</div>

			<div class="input-group">
				<label>Password</label> <input type="password"
					placeholder="Create password" name="pass" required>
			</div>

			<button type="submit" class="btn">Register</button>

			<div class="footer">
				Already have an account? <a href="#">Login</a>
			</div>
		</form>
	</div>

</body>
</html>
</body>
</html>
