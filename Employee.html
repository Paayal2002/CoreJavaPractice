<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration Form</title>
</head>
<body>

<center>
    <h2>Employee Registration Form</h2>

    <form action="success.html" method="get">

        Employee ID:
        <input type="text" name="empid" required><br><br>

        First Name:
        <input type="text" name="fname" required><br><br>

        Last Name:
        <input type="text" name="lname" required><br><br>

        Gender:
        <input type="radio" name="gender" value="Male" required> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        Date of Birth:
        <input type="date" name="dob" required><br><br>

        Email:
        <input type="email" name="email" required><br><br>

        Mobile:
        <input type="tel" name="mobile" required><br><br>

        Address:
        <textarea name="address" required></textarea><br><br>

        City:
        <input type="text" name="city" required><br><br>

        State:
        <input type="text" name="state" required><br><br>

        Pincode:
        <input type="number" name="pincode" required><br><br>

        Department:
        <input type="text" name="department" required><br><br>

        Designation:
        <input type="text" name="designation" required><br><br>

        Salary:
        <input type="number" name="salary" required><br><br>

        Date of Joining:
        <input type="date" name="doj" required><br><br>

        Qualification:
        <input type="text" name="qualification" required><br><br>

        Experience:
        <input type="number" name="experience" required><br><br>

        Marital Status:
        <select name="status" required>
            <option value="">Select</option>
            <option>Single</option>
            <option>Married</option>
        </select>
        <br><br>

        Skills:
        <input type="checkbox" name="skills" value="Java"> Java
        <input type="checkbox" name="skills" value="Python"> Python
        <input type="checkbox" name="skills" value="SQL"> SQL
        <br><br>

        Emergency Contact:
        <input type="tel" name="emergency" required><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>
</center>

</body>
</html>
